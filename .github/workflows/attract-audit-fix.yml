name: One-time attract audit fix

on:
  push:
    branches:
      - tmp-attract-audit-fix
    paths:
      - '.github/workflows/attract-audit-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-attract-audit-fix
          fetch-depth: 0
      - name: Patch attract mode and Level 2
        run: python scripts/fix_attract_audit.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit clean result to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/fix_attract_audit.py .github/workflows/attract-audit-fix.yml
          git add -A
          git commit -m "Fix attract cargo and rebalance sparse QR zones"
          git push origin HEAD:main
