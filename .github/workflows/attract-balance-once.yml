name: One-time attract mode balancing

on:
  push:
    paths:
      - '.github/workflows/attract-balance-once.yml'

permissions:
  contents: write

jobs:
  balance-attract-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebalance live colony
        run: python scripts/rebalance_attract.py
      - name: Validate JavaScript
        run: node --check game.js
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git diff --cached --quiet && exit 0
          git commit -m "Rebalance attract colony across QR perimeter"
          git push origin HEAD:main
