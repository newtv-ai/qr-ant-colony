<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17130f" />
  <title>QR Ant Colony · 二维码蚁穴</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-line">
          <span class="brand-mark">QR ANT COLONY</span>
          <span class="status-badge" id="gameStateBadge">第1关 · 教学</span>
        </div>
        <h1>二维码蚁穴</h1>
      </div>

      <section class="qr-toolbar" aria-label="二维码内容设置">
        <input id="qrInput" type="text" value="https://github.com/newtv-ai/qr-ant-colony" autocomplete="off" spellcheck="false" aria-label="二维码内容" />
        <button id="generateBtn" class="primary">生成新蚁穴</button>
        <button id="scanBtn" class="secondary">扫码模式</button>
      </section>

      <div class="scan-wrap">
        <span id="scanHealth" class="scan-health checking">正在检测游戏画面...</span>
        <small>游戏中实时检测扫码可读性</small>
      </div>
    </header>

    <section class="workspace">
      <div class="board-zone">
        <div class="board-wrap">
          <canvas id="gameCanvas" width="900" height="900" aria-label="二维码蚁穴游戏画面"></canvas>
          <div id="toast" class="toast" role="status" aria-live="polite"></div>
        </div>
      </div>

      <aside class="side-panel">
        <div class="chapter-card">
          <div class="chapter-topline">
            <span id="chapterNumber">第 1 关</span>
            <strong id="chapterTitle">第一顿饭</strong>
          </div>
          <p id="chapterDesc">不限时间。找到食物并带回气味，让工蚁开始运输，把蚁群人口养到 10。</p>
          <div class="population-track"><span id="populationBar"></span></div>
        </div>

        <div class="stats-grid">
          <div class="stat-card"><span id="statLabel1">蚁群人口</span><strong id="populationCount">3 / 10</strong></div>
          <div class="stat-card"><span id="statLabel2">储备食物</span><strong id="foodScore">0</strong></div>
          <div class="stat-card"><span id="statLabel3">运输工蚁</span><strong id="workerCount">2</strong></div>
          <div class="stat-card"><span id="statLabel4">发现食物</span><strong id="discoveredCount">0</strong></div>
        </div>

        <div class="mission-card">
          <div class="card-title-row"><h2>当前任务</h2><span class="key-tip">WASD / ↑↓←→</span></div>
          <p id="missionText">先熟悉移动，去白色通道里找到第一份食物。</p>
          <button id="nextLevelBtn" class="level-next" hidden>进入第2关：暴雨来了 →</button>
        </div>

        <div class="buff-card">
          <h2>当前增益</h2>
          <p id="buffText">暂无 · 高等级食物会带来额外效果</p>
        </div>

        <div class="legend-card" id="legendCard">
          <h2>图例</h2>
          <div class="legend"><span class="legend-ant player-ant"></span><span>你</span></div>
          <div class="legend"><span class="legend-ant worker-ant"></span><span>工蚁</span></div>
          <div class="legend"><span>🍩</span><span>2份</span></div>
          <div class="legend"><span>🧁</span><span>3份 · 加速</span></div>
          <div class="legend"><span>🍰</span><span>5份 · +1人口</span></div>
          <div class="legend"><span class="legend-nest"></span><span>蚁穴</span></div>
        </div>

        <div class="action-bar desktop-actions">
          <span class="action-label">操作</span>
          <button id="biteBtn" disabled title="第3关解锁">Space · 🦷 咬</button>
          <button id="acidBtn" disabled title="第4关解锁">F · 💧 蚁酸</button>
        </div>

        <section class="roadmap">
          <div class="roadmap-step active" id="roadmap1"><span>1</span><strong>第一顿饭</strong></div>
          <div class="roadmap-step locked" id="roadmap2"><span>2</span><strong>暴雨</strong></div>
          <div class="roadmap-step locked" id="roadmap3"><span>3</span><strong>入侵</strong></div>
          <div class="roadmap-step locked" id="roadmap4"><span>4</span><strong>狩猎</strong></div>
        </section>
      </aside>
    </section>

    <section class="mobile-controls" aria-label="移动控制">
      <div class="dpad">
        <button data-dir="up" aria-label="向上">▲</button>
        <div>
          <button data-dir="left" aria-label="向左">◀</button>
          <button data-dir="down" aria-label="向下">▼</button>
          <button data-dir="right" aria-label="向右">▶</button>
        </div>
      </div>
      <div class="action-preview">
        <button data-mobile-action="bite" disabled>🦷 咬</button>
        <button data-mobile-action="acid" disabled>💧 蚁酸</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js'"></script>
  <script src="game.js"></script>
</body>
</html>
